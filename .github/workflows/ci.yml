name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint and dry run
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Plan (reads upstream releases, changes nothing)
        run: scripts/plan.sh | jq .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build the first app into a local repository
        run: |
          app=$(yq -o=json -I=0 '.apps[0]' apps.yml)
          version=$(jq -r .since <<<"$app")
          asset=$(jq -r .asset <<<"$app" | sed "s/{version}/${version}/")
          scripts/fetch.sh "$(jq -r .upstream <<<"$app")" "$version" "$asset" build/input
          gradle --no-daemon \
            -PappId="$(jq -r .id <<<"$app")" -PappName="$(jq -r .name <<<"$app")" \
            -PappDescription="$(jq -r .description <<<"$app")" -PappUpstream="$(jq -r .upstream <<<"$app")" \
            -PappArtifactId="$(jq -r '."artifact-id"' <<<"$app")" \
            -PappVersion="$version" -PappAsset="$asset" -PinputDir=build/input \
            publishAllPublicationsToBuildRepository
