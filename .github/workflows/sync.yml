name: Sync releases

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays at 06:17 UTC; GitHub may delay scheduled runs under load
  workflow_dispatch:
    inputs:
      release:
        description: 'Release to Maven Central. Off: upload and validate the staging repository, then stop.'
        type: boolean
        default: false
      override_cooldown:
        description: 'Ignore the seven-day cooldown. Already published or reserved versions remain blocked.'
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time: Maven Central staging must see versions in order.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  plan:
    name: Find new upstream releases
    # The schedule only does anything once the repository variable PUBLISH is 'true'.
    if: github.event_name == 'workflow_dispatch' || vars.PUBLISH == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE_COOLDOWN: ${{ github.event_name == 'workflow_dispatch' && inputs.override_cooldown && 'true' || 'false' }}
        run: |
          matrix=$(scripts/plan.sh)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"
          jq -r '.include[] | "new: \(.tag)"' <<<"$matrix"

  publish:
    name: Publish ${{ matrix.tag }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates the tag and release that mark a version as published
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      # Real release: scheduled run with PUBLISH=true, or a manual run with "release" ticked.
      RELEASE: ${{ (github.event_name == 'schedule' || inputs.release) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Download and verify upstream release
        run: scripts/fetch.sh '${{ matrix.upstream }}' '${{ matrix.version }}' '${{ matrix.asset }}' build/input

      # Keep the reservation if publishing fails or times out: an ambiguous upload must
      # be investigated before retrying this version, even before Central indexes it.
      - name: Reserve version before publishing
        if: env.RELEASE == 'true'
        run: |
          gh release create '${{ matrix.tag }}' --draft \
            --target '${{ github.sha }}' \
            --title '${{ matrix.name }} ${{ matrix.version }}' \
            --notes 'Publication reserved. If this run fails, check Central before removing this draft to retry.'

      - name: Build and publish to Maven Central
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          gradle --no-daemon -PskipJPP \
            -PappId='${{ matrix.id }}' \
            -PappName='${{ matrix.name }}' \
            -PappDescription='${{ matrix.description }}' \
            -PappUpstream='${{ matrix.upstream }}' \
            -PappArtifactId='${{ matrix.artifact-id }}' \
            -PappVersion='${{ matrix.version }}' \
            -PappAsset='${{ matrix.asset }}' \
            -PinputDir=build/input \
            publishToSonatype ${{ env.RELEASE == 'true' && 'closeAndReleaseSonatypeStagingRepository' || 'closeSonatypeStagingRepository' }}

      # Last step on purpose: plan.sh checks both this tag and Maven Central,
      # so a failed marker step cannot cause the same version to be republished.
      - name: Mark as published
        if: env.RELEASE == 'true'
        run: |
          gh release upload '${{ matrix.tag }}' 'build/libs/${{ matrix.artifact-id }}-${{ matrix.version }}.jar'
          gh release edit '${{ matrix.tag }}' --draft=false \
            --title '${{ matrix.name }} ${{ matrix.version }}' \
            --notes "Republishes [${{ matrix.upstream }} v${{ matrix.version }}](https://github.com/${{ matrix.upstream }}/releases/tag/v${{ matrix.version }}) as \`de.inetsoftware:${{ matrix.artifact-id }}:${{ matrix.version }}\` on Maven Central. The upstream checksum was verified before publishing."
